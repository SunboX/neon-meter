[platformio]
default_envs = m5stack-cores3
src_dir = src
test_dir = tests

[env]
monitor_speed = 115200
upload_speed = 1500000
lib_ldf_mode = deep+

[env:m5stack-cores3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
extra_scripts = pre:scripts/patch_m5gfx.py
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DESP32S3
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_ARC=1
    -DLV_USE_LABEL=1
    -DLV_USE_BUTTON=1
    -DLV_USE_BTN=1
    -DLV_USE_OBJ=1
    -DLV_USE_CANVAS=1
    -DLV_TICK_CUSTOM=1
    -DLV_MEM_CUSTOM=0
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_32=1
lib_deps =
    m5stack/M5Unified@^0.2.7
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -DUNIT_TEST
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_src_filter =
    -<*>
    +<ble_identity_value.cpp>
    +<orientation.cpp>
    +<ui_connection_state.cpp>
    +<ui_footer.cpp>
    +<ui_footer_loader.cpp>
    +<splash_animation.cpp>
    +<serial_protocol.cpp>
    +<usb_connection_state.cpp>
    +<usage_model.cpp>
    +<usage_rate.cpp>
