name: Deploy ESP Web Tools

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Validate ESP Web Tools assets
        run: npm run validate:web-tools

      - name: Build CoreS3 firmware
        run: npm run build

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p public/firmware
          cp -R web/esp-web-tools/. public/
          cp .pio/build/m5stack-cores3/bootloader.bin public/firmware/bootloader.bin
          cp .pio/build/m5stack-cores3/partitions.bin public/firmware/partitions.bin
          cp .pio/build/m5stack-cores3/firmware.bin public/firmware/firmware.bin
          boot_app0="$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          test -n "$boot_app0"
          cp "$boot_app0" public/firmware/boot_app0.bin
          cp .pio/build/m5stack-cores3/firmware.factory.bin public/firmware/neon-meter-m5stack-cores3.factory.bin

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
