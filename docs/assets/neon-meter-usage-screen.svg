<rect x="34" y="173" width="256" height="10" rx="4" fill="#102638" opacity="1"/>
<rect x="34" y="173" width="8" height="10" rx="4" fill="#ffb8c4" filter="url(#barGlow)"/>
<text x="34" y="196" fill="#31eaff" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="alphabetic">Resets in 3d 2h</text></g>
  <g><circle cx="60.75999999999999" cy="222" r="3" fill="#ff6a00"/>
<circle cx="69.75999999999999" cy="222" r="3" fill="#ff6a00" opacity="0.45"/>
<circle cx="78.75999999999999" cy="222" r="3" fill="#ff6a00" opacity="0.25"/>
<text x="89.75999999999999" y="226" fill="#ff6a00" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="alphabetic">Quiet - 5h 8% / 7d 98%</text></g>
